services:
  paper-qa-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8010"
    volumes:
      - type: bind
        source: /home/sup3rgj/ai-data/papers
        target: /data/papers
      - type: bind
        source: /home/sup3rgj/ai-data/docling-mcp/cache
        target: /data/docling-mcp/cache
        read_only: true
    environment:
      PAPER_QA_ROOT: /data/papers
      DOCLING_CACHE_ROOT: /data/docling-mcp/cache
      PAPER_QA_IMPORT_MAX_BYTES: "104857600"
      PAPER_QA_TRANSPORT: http
      PAPER_QA_PORT: "8010"
      PAPER_QA_PANDOC: /usr/local/bin/pandoc
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


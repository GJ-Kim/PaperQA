services:
  paper-qa-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8010"
    volumes:
      - type: bind
        source: /home/sup3rgj/ai-data
        target: /data
    environment:
      PAPER_QA_ROOT: /data/papers
      PAPER_QA_TRANSPORT: http
      PAPER_QA_PORT: "8010"
      PAPER_QA_PANDOC: /usr/local/bin/pandoc
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL


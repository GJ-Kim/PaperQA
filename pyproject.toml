[project]
name = "paper-qa-mcp"
version = "0.1.0"
description = "File-based QA MCP for translated academic papers"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastmcp==4.1.0",
  "lxml==6.0.2",
  "pydantic==2.12.3",
]

[project.scripts]
paper-qa-mcp = "paper_qa.server:main"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_qa"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

